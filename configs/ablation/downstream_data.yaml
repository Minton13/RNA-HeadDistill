# Downstream dataset preparation config for Stage 5 frozen probes.
# All paths are relative to the rna_head_alignment project root.

sequence_manifest: outputs/teacher_attention_cache_slim/stage4b_head2head/manifests/sequence_manifest.parquet
output_root: data/downstream_stage5
report_dir: outputs/ablation/downstream

full_slim_cache_root: outputs/teacher_attention_cache_slim/stage4b_head2head/full
downstream_teacher_cache_root: outputs/downstream_teacher_head_cache

split:
  train: 0.8
  val: 0.1
  test: 0.1
  seed: 42

# Per-task source configuration.
tasks:
  splice_donor_seqcls:
    task_type: sequence_classification
    source_path: assets/data/splice_site/splice_site_full.csv
    label_column: splice_class
    positive_class: 1
    family_column: splice_class
    source_dataset_name: dnagpt/dna_splice_site_prediction
    max_len: 512

  splice_acceptor_seqcls:
    task_type: sequence_classification
    source_path: assets/data/splice_site/splice_site_full.csv
    label_column: splice_class
    positive_class: 2
    family_column: splice_class
    source_dataset_name: dnagpt/dna_splice_site_prediction
    max_len: 512

  rbp_binding_seqcls:
    task_type: sequence_classification
    source_path: assets/data/rbp_binding/rbp_binding_full.csv
    label_column: label
    family_column: rbp
    preserve_source_split: true
    source_dataset_name: rbp24
    max_len: 512

  ncRNA_family_seqcls:
    task_type: sequence_classification
    source_path: assets/data/rfam/rfam_mini.csv
    label_column: label
    family_column: family
    preserve_source_split: true
    source_dataset_name: Rfam
    max_len: 512

  chemical_reactivity_token:
    task_type: token_regression
    source_path: assets/data/ribonanza/hf_TerminatorJ_RNA_chemical_ribonanza/train_data_QUICK_START.csv
    token_value_prefix: reactivity_
    experiment_types:
      - 2A3_MaP
      - DMS_MaP
    group_column: dataset_name
    source_dataset_name: Ribonanza
    max_len: 512

  secondary_structure_pair:
    task_type: pairwise
    source_path: assets/data/secondary/secondary_full.jsonl
    family_column: source
    preserve_source_split: true
    source_dataset_name: bpRNA90/PDB
    max_len: 512
