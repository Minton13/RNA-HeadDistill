# Demo task registry: two synthetic tasks generated by scripts/demo/make_toy_data.py.
# Same schemas as configs/tasks.yaml (the real 15-task registry).
tasks:
  toy_family_seqcls:
    group: L6
    task_type: sequence_classification
    path: data/demo/toy_family_seqcls.csv
    metric: macro_f1

  toy_secondary_structure_pair:
    group: L12
    task_type: pairwise
    path: data/demo/toy_secondary_structure.jsonl
    metric: auprc
    max_len: 96
