device: auto
max_len: 96
batch_size: 1
limit: 8
seed: 42
heatmaps:
  score_scale: normalized_0_1
  vmin: 0.0
  vmax: 1.0
  cmap: viridis
probe:
  min_train_samples: 4
  max_iter: 100
  balanced_subset_per_class: 20
pairwise:
  min_separation: 3
  threshold: 0.5
selection:
  per_model_per_task_top_k: 3
  global_per_task_top_k: 10
  global_per_layer_bank_top_k: 20
  min_metric_quantile: 0.80
  max_heads_per_model_per_task: 3
  max_heads_per_source_layer_per_task: 2
  prefer_model_diversity: true
  prefer_layer_diversity: true
layer_banks:
  L6:
    tasks:
      - splice_site_seqcls
      - rbp_binding_seqcls
      - ncRNA_family_seqcls
      - mrna_stability_cds_bart_regression
      - mrna_stability_gleghorn_regression
      - mrna_ribosome_loading_regression
    student_layer: 6
    dna_student_head_fraction: 0.333
  L8:
    tasks:
      - chemical_reactivity_token
      - chemical_reactivity_ribonanza_2a3
      - chemical_reactivity_ribonanza_dms
      - chemical_reactivity_rnascope
      - openvaccine_reactivity_token
      - openvaccine_deg_mg_ph10_token
      - openvaccine_deg_mg_50c_token
    student_layer: 8
  L12:
    tasks:
      - secondary_structure_pair
      - rna3d_rnaglib
      - rnascope_contact_map
    student_layer: 12
